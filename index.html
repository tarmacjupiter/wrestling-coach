<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pose Model</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <h1>Wrestling Stance Pose Model</h1>

    <div class="controls">
      <button type="button" id="startBtn" onclick="init()">Start Camera</button>
      <button
        type="button"
        id="stopBtn"
        onclick="stop()"
        style="display: none"
        class="danger"
      >
        Stop Camera
      </button>
      <button
        type="button"
        id="resetBtn"
        onclick="resetStats()"
        style="display: none"
        class="secondary"
      >
        Reset Statistics
      </button>
      <button
        type="button"
        id="exportBtn"
        onclick="exportData()"
        style="display: none"
        class="secondary"
      >
        Export Data
      </button>
    </div>

    <div class="error-message" id="errorMessage"></div>

    <div class="loading-indicator" id="loadingIndicator">
      <div class="spinner"></div>
      <p>Loading model and setting up camera...</p>
    </div>

    <div class="main-content" style="display: none" id="mainContent">
      <div class="video-section">
        <canvas id="canvas"></canvas>
        <div class="predictions-panel">
          <h2>Live Predictions</h2>
          <div id="label-container"></div>
        </div>
      </div>

      <div class="stats-section">
        <div class="current-pose" id="currentPoseDisplay">
          <div class="current-pose-label">Current Pose</div>
          <div class="current-pose-name">Waiting...</div>
          <div class="current-pose-timer" id="poseTimer">0.0s</div>
        </div>

        <div class="stats-panel">
          <h2>Session Statistics</h2>
          <div class="session-info" id="sessionInfo">
            Session Duration: <strong>0s</strong>
          </div>
          <div id="statsContainer">
            <div class="empty-state">Start moving to see statistics</div>
          </div>
        </div>

        <div class="stats-panel">
          <h2>Pose Duration Chart</h2>
          <div class="bar-chart" id="barChart">
            <div class="empty-state">No data yet</div>
          </div>
        </div>

        <div class="stats-panel">
          <h2>
            Pose History
            <span style="font-size: 12px; font-weight: normal; color: #666"
              >(Last 20)</span
            >
          </h2>
          <div class="history-log" id="historyLog">
            <div class="empty-state">No poses detected yet</div>
          </div>
        </div>
      </div>
    </div>

    <!-- External Libraries -->
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@1.3.1/dist/tf.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@teachablemachine/pose@0.8/dist/teachablemachine-pose.min.js"></script>

    <!-- Application Script -->
    <script src="app.js"></script>
  </body>
</html>
